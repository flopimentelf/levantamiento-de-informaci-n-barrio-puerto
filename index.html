
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tramas de elección</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #202020;
      font-family: Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .pagina {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    #lluvia {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      touch-action: none;
      cursor: grab;
    }

    #lluvia:active {
      cursor: grabbing;
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      padding: 28px 5vw;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .marca {
      font-weight: 700;
    }

    .numero {
      color: #777;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 75svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 8vh 10vw 24vh;
      pointer-events: none;
    }

    .etiqueta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #666;
    }

    .punto {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4da67d;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(48px, 9vw, 112px);
      line-height: .91;
      letter-spacing: -.085em;
      font-weight: 700;
    }

    h1 span {
      display: block;
      color: #999;
      font-weight: 400;
    }

    .descripcion {
      max-width: 340px;
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    footer {
      position: absolute;
      z-index: 2;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 5vw 30px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        #fff 90%
      );
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #666;
      pointer-events: none;
    }

    .colores {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .color {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .rojo { background: #dc4245; }
    .azul { background: #3f84cd; }
    .amarillo { background: #f6c241; }
    .verde { background: #4da67d; }

    .reiniciar {
      pointer-events: auto;
      border: 1px solid #ddd;
      background: white;
      color: #333;
      border-radius: 100px;
      padding: 11px 16px;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header { padding: 22px 6vw; }

      main { padding: 10vh 7vw 28vh; }

      h1 { font-size: clamp(48px, 14vw, 78px); }

      .descripcion {
        max-width: 280px;
        font-size: 13px;
      }

      footer { padding: 20px 6vw 24px; }
    }
  </style>
</head>

<body>
  <div class="pagina" id="pagina">
    <canvas id="lluvia" aria-label="Octágonos de colores que puedes mover"></canvas>

    <header>
      <div class="marca">Proyecto de observación</div>
      <div class="numero">Visualización / 001</div>
    </header>

    <main>
      <div class="etiqueta">
        <span class="punto"></span>
        Levantamiento de información
      </div>

      <h1>
        Tramas
        <span>de elección.</span>
      </h1>

      <p class="descripcion">
        Cada elección deja una huella. Las piezas se acumulan,
        se encuentran y construyen una imagen colectiva del territorio.
      </p>
    </main>

    <footer>
      <div>
        <div>Una construcción colectiva</div>
        <div class="colores">
          <span class="color rojo"></span>
          <span class="color azul"></span>
          <span class="color amarillo"></span>
          <span class="color verde"></span>
        </div>
      </div>

      <button class="reiniciar" id="reiniciar" type="button">
        ↻ Comenzar de nuevo
      </button>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("lluvia");
    const ctx = canvas.getContext("2d");
    const pagina = document.getElementById("pagina");
    const boton = document.getElementById("reiniciar");

    const colores = [
      "#dc4245",
      "#3f84cd",
      "#f6c241",
      "#4da67d"
    ];

    const cantidad = 320;
    const gravedad = 0.22;
    const piezas = [];

    let ancho, alto;
    let ultimoTiempo = 0;
    let arrastrada = null;
    let punteroAnterior = null;
    let raf;

    const azar = (min, max) => Math.random() * (max - min) + min;

    class Pieza {
      constructor(x, y, tamano, color, velocidadInicial = 0) {
        this.x = x;
        this.y = y;
        this.t = tamano;
        this.color = color;
        this.vx = azar(-1.8, 1.8);
        this.vy = velocidadInicial || azar(-1, 2);
        this.angulo = azar(0, Math.PI / 4);
        this.giro = azar(-0.035, 0.035);
        this.agarrada = false;
        this.detenida = false;
      }

      dibujar() {
        const radio = this.t / 2;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angulo);
        ctx.beginPath();

        // Octágono regular, sin contornos ni efectos.
        for (let i = 0; i < 8; i++) {
          const a = (Math.PI * 2 * i / 8) - Math.PI / 8;
          const x = Math.cos(a) * radio;
          const y = Math.sin(a) * radio;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      actualizar(dt) {
        if (this.agarrada) return;

        this.vy += gravedad * dt;
        this.vy = Math.min(this.vy, 10);

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angulo += this.giro * dt;

        const r = this.t * 0.42;

        // Límites laterales.
        if (this.x < r) {
          this.x = r;
          this.vx = Math.abs(this.vx) * 0.55;
        }

        if (this.x > ancho - r) {
          this.x = ancho - r;
          this.vx = -Math.abs(this.vx) * 0.55;
        }

        // Suelo.
        if (this.y + r >= alto) {
          this.y = alto - r;
          this.vy *= -0.12;

          if (Math.abs(this.vy) < 0.7) this.vy = 0;

          this.vx *= 0.985;
        }
      }
    }

    function ajustar() {
      const rect = pagina.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      ancho = rect.width;
      alto = rect.height;

      canvas.width = Math.round(ancho * dpr);
      canvas.height = Math.round(alto * dpr);
      canvas.style.width = ancho + "px";
      canvas.style.height = alto + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function crearPiezas() {
      piezas.length = 0;

      for (let i = 0; i < cantidad; i++) {
        const t = azar(20, 43);

        piezas.push(new Pieza(
          azar(t, Math.max(t, ancho - t)),
          azar(-alto * 3, -20),
          t,
          colores[Math.floor(Math.random() * colores.length)],
          azar(0, 2)
        ));
      }
    }

    // Colisiones aproximadas para que las piezas se empujen.
    function resolverColisiones() {
      for (let i = 0; i < piezas.length; i++) {
        const a = piezas[i];

        for (let j = i + 1; j < piezas.length; j++) {
          const b = piezas[j];

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distancia = Math.hypot(dx, dy);
          const minimo = (a.t + b.t) * 0.39;

          if (distancia === 0 || distancia >= minimo) continue;

          const nx = dx / distancia;
          const ny = dy / distancia;
          const solapamiento = minimo - distancia;

          if (!a.agarrada && !b.agarrada) {
            a.x -= nx * solapamiento * 0.5;
            a.y -= ny * solapamiento * 0.5;
            b.x += nx * solapamiento * 0.5;
            b.y += ny * solapamiento * 0.5;

            const relativa =
              (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;

            if (relativa < 0) {
              const impulso = relativa * 0.36;
              a.vx += impulso * nx;
              a.vy += impulso * ny;
              b.vx -= impulso * nx;
              b.vy -= impulso * ny;
            }
          } else {
            const libre = a.agarrada ? b : a;
            const fija = a.agarrada ? a : b;
            const signo = a.agarrada ? 1 : -1;

            libre.x += nx * solapamiento * signo;
            libre.y += ny * solapamiento * signo;
            libre.vx += nx * signo * 0.5;
            libre.vy += ny * signo * 0.5;
          }
        }
      }
    }

    function dibujar(tiempo) {
      const dt = Math.min((tiempo - (ultimoTiempo || tiempo)) / 16.67, 1.5);
      ultimoTiempo = tiempo;

      ctx.clearRect(0, 0, ancho, alto);

      for (const pieza of piezas) pieza.actualizar(dt);

      resolverColisiones();

      for (const pieza of piezas) pieza.dibujar();

      raf = requestAnimationFrame(dibujar);
    }

    function iniciar() {
      cancelAnimationFrame(raf);
      ultimoTiempo = 0;
      arrastrada = null;
      punteroAnterior = null;
      ajustar();
      crearPiezas();
      raf = requestAnimationFrame(dibujar);
    }

    function posicion(evento) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: evento.clientX - rect.left,
        y: evento.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", evento => {
      const p = posicion(evento);

      // Elegir la pieza visible más cercana al cursor.
      for (let i = piezas.length - 1; i >= 0; i--) {
        const pieza = piezas[i];
        const distancia = Math.hypot(p.x - pieza.x, p.y - pieza.y);

        if (distancia <= pieza.t * 0.75) {
          arrastrada = pieza;
          pieza.agarrada = true;
          pieza.vx = 0;
          pieza.vy = 0;
          punteroAnterior = p;

          // Llevar la pieza seleccionada al frente.
          piezas.splice(i, 1);
          piezas.push(pieza);

          canvas.setPointerCapture(evento.pointerId);
          evento.preventDefault();
          break;
        }
      }
    });

    canvas.addEventListener("pointermove", evento => {
      const p = posicion(evento);

      if (arrastrada && punteroAnterior) {
        arrastrada.vx = (p.x - punteroAnterior.x) * 0.8;
        arrastrada.vy = (p.y - punteroAnterior.y) * 0.8;
        arrastrada.x = p.x;
        arrastrada.y = p.y;
        punteroAnterior = p;
      }
    });

    function soltar() {
      if (arrastrada) {
        arrastrada.agarrada = false;
        arrastrada.vx = Math.max(-16, Math.min(16, arrastrada.vx));
        arrastrada.vy = Math.max(-16, Math.min(16, arrastrada.vy));
      }

      arrastrada = null;
      punteroAnterior = null;
    }

    canvas.addEventListener("pointerup", soltar);
    canvas.addEventListener("pointercancel", soltar);
    boton.addEventListener("click", iniciar);

    window.addEventListener("resize", ajustar);

    iniciar();
  </script>
</body>
</html>
