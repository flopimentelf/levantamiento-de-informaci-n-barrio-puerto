
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tramas de elección</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #202020;
      font-family: Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .pagina {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    #lluvia {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      touch-action: none;
      cursor: grab;
    }

    #lluvia:active {
      cursor: grabbing;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 28px 5vw;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .marca {
      font-weight: 700;
    }

    .numero {
      color: #777;
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 75svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 8vh 10vw 24vh;
      pointer-events: none;
    }

    .etiqueta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #666;
    }

    .punto {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4da67d;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(48px, 9vw, 112px);
      line-height: .91;
      letter-spacing: -.085em;
      font-weight: 700;
    }

    h1 span {
      display: block;
      color: #999;
      font-weight: 400;
    }

    .descripcion {
      max-width: 340px;
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    footer {
      position: absolute;
      z-index: 3;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 5vw 30px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        #fff 90%
      );
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #666;
      pointer-events: none;
    }

    .colores {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .color {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .rojo { background: rgba(220, 66, 69, .65); }
    .azul { background: rgba(63, 132, 205, .65); }
    .amarillo { background: rgba(246, 194, 65, .70); }
    .verde { background: rgba(77, 166, 125, .65); }

    .reiniciar {
      pointer-events: auto;
      border: 1px solid #ddd;
      background: white;
      color: #333;
      border-radius: 100px;
      padding: 11px 16px;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 6vw;
      }

      main {
        padding: 10vh 7vw 28vh;
      }

      h1 {
        font-size: clamp(48px, 14vw, 78px);
      }

      .descripcion {
        max-width: 280px;
        font-size: 13px;
      }

      footer {
        padding: 20px 6vw 24px;
      }
    }
  </style>
</head>

<body>
  <div class="pagina" id="pagina">
    <canvas id="lluvia" aria-label="Pentágonos de colores interactivos"></canvas>

    <header>
      <div class="marca">Proyecto de observación</div>
      <div class="numero">Visualización / 001</div>
    </header>

    <main>
      <div class="etiqueta">
        <span class="punto"></span>
        Levantamiento de información
      </div>

      <h1>
        Tramas
        <span>de elección.</span>
      </h1>

      <p class="descripcion">
        Cada elección deja una huella. Las piezas se acumulan,
        se encuentran y construyen una imagen colectiva del territorio.
      </p>
    </main>

    <footer>
      <div>
        <div>Una construcción colectiva</div>
        <div class="colores">
          <span class="color rojo"></span>
          <span class="color azul"></span>
          <span class="color amarillo"></span>
          <span class="color verde"></span>
        </div>
      </div>

      <button class="reiniciar" id="reiniciar" type="button">
        ↻ Comenzar de nuevo
      </button>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("lluvia");
    const ctx = canvas.getContext("2d");
    const pagina = document.getElementById("pagina");
    const boton = document.getElementById("reiniciar");

    const colores = [
      "rgba(220,66,69,0.62)",
      "rgba(63,132,205,0.62)",
      "rgba(246,194,65,0.68)",
      "rgba(77,166,125,0.62)"
    ];

    // 20 % más de piezas que la versión anterior.
    const CANTIDAD = 204;
    const GRAVEDAD = 0.16;
    const piezas = [];

    let ancho = 0;
    let alto = 0;
    let ultimoTiempo = 0;
    let raf = 0;
    let arrastrada = null;
    let punteroAnterior = null;

    const azar = (min, max) => Math.random() * (max - min) + min;
    const limitar = (v, min, max) => Math.max(min, Math.min(max, v));

    class Pentagono {
      constructor(x, y, tamano, color, retraso) {
        this.x = x;
        this.y = y;
        this.t = tamano;
        this.color = color;

        // Algunas piezas caen en diagonal y otras casi verticales.
        this.vx = azar(-2.0, 2.0);
        this.vy = azar(0.2, 1.1);

        this.angulo = azar(-0.3, 0.3);
        this.giro = azar(-0.009, 0.009);
        this.retraso = retraso;
        this.agarrada = false;
        this.quieta = false;
        this.listo = false;
      }

      dibujar() {
        const radio = this.t / 2;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angulo);
        ctx.beginPath();

        for (let i = 0; i < 5; i++) {
          const a = (Math.PI * 2 * i / 5) - Math.PI / 2;
          const px = Math.cos(a) * radio;
          const py = Math.sin(a) * radio;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      actualizar(dt, tiempo) {
        if (this.agarrada || this.quieta) return;
        if (tiempo < this.retraso) return;

        this.listo = true;

        this.vy = Math.min(this.vy + GRAVEDAD * dt, 5.5);

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angulo += this.giro * dt;

        const r = this.t * 0.46;

        if (this.x < r) {
          this.x = r;
          this.vx = Math.abs(this.vx) * 0.5;
        }

        if (this.x > ancho - r) {
          this.x = ancho - r;
          this.vx = -Math.abs(this.vx) * 0.5;
        }

        if (this.y + r >= alto) {
          this.y = alto - r;
          this.detener();
        }
      }

      detener() {
        this.vx = 0;
        this.vy = 0;
        this.giro = 0;
        this.quieta = true;
      }

      reactivar() {
        this.quieta = false;
        this.vx = 0;
        this.vy = 0;
      }
    }

    function ajustarCanvas() {
      const rect = pagina.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      ancho = rect.width;
      alto = rect.height;

      canvas.width = Math.round(ancho * dpr);
      canvas.height = Math.round(alto * dpr);
      canvas.style.width = ancho + "px";
      canvas.style.height = alto + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function crearPiezas() {
      piezas.length = 0;

      for (let i = 0; i < CANTIDAD; i++) {
        // Pentágonos un poco más grandes.
        const t = azar(52, 82);

        piezas.push(new Pentagono(
          azar(t / 2, Math.max(t / 2, ancho - t / 2)),
          azar(-alto * 3, -30),
          t,
          colores[Math.floor(Math.random() * colores.length)],
          i * 22
        ));
      }
    }

    function resolverColisiones() {
      for (let pasada = 0; pasada < 2; pasada++) {
        for (let i = 0; i < piezas.length; i++) {
          const a = piezas[i];
          if (!a.listo) continue;

          for (let j = i + 1; j < piezas.length; j++) {
            const b = piezas[j];
            if (!b.listo) continue;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distancia = Math.hypot(dx, dy);

            // Separación parcial para permitir solapamientos visuales.
            const minimo = (a.t + b.t) * 0.36;

            if (distancia === 0 || distancia >= minimo) continue;

            const nx = dx / distancia;
            const ny = dy / distancia;
            const penetracion = minimo - distancia;

            if (a.agarrada) {
              if (!b.agarrada && !b.quieta) {
                b.x += nx * penetracion;
                b.y += ny * penetracion;
                b.vx += nx * 0.3;
                b.vy += ny * 0.3;
              }
              continue;
            }

            if (b.agarrada) {
              if (!a.quieta) {
                a.x -= nx * penetracion;
                a.y -= ny * penetracion;
                a.vx -= nx * 0.3;
                a.vy -= ny * 0.3;
              }
              continue;
            }

            if (a.quieta && b.quieta) continue;

            if (a.quieta) {
              b.x += nx * penetracion;
              b.y += ny * penetracion;
            } else if (b.quieta) {
              a.x -= nx * penetracion;
              a.y -= ny * penetracion;
            } else {
              a.x -= nx * penetracion * 0.5;
              a.y -= ny * penetracion * 0.5;
              b.x += nx * penetracion * 0.5;
              b.y += ny * penetracion * 0.5;
            }

            // Reducir las vibraciones después del contacto.
            if (!a.quieta) {
              a.vx *= 0.65;
              if (Math.abs(a.vx) < 0.12) a.vx = 0;
            }

            if (!b.quieta) {
              b.vx *= 0.65;
              if (Math.abs(b.vx) < 0.12) b.vx = 0;
            }

            // Asentamiento al caer sobre otra pieza.
            if (Math.abs(dx) < minimo * 0.8) {
              if (dy > 0 && a.vy >= b.vy && !a.quieta) {
                a.y = b.y - minimo;

                if (a.vy < 1.8) {
                  a.detener();
                } else {
                  a.vy *= 0.25;
                }
              } else if (dy < 0 && b.vy >= a.vy && !b.quieta) {
                b.y = a.y - minimo;

                if (b.vy < 1.8) {
                  b.detener();
                } else {
                  b.vy *= 0.25;
                }
              }
            }
          }
        }
      }

      for (const p of piezas) {
        if (!p.listo || p.quieta || p.agarrada) continue;

        const r = p.t * 0.46;

        if (p.y + r >= alto) {
          p.y = alto - r;
          p.detener();
        }
      }
    }

    function dibujar(tiempo) {
      const dt = Math.min(
        (tiempo - (ultimoTiempo || tiempo)) / 16.67,
        1
      );

      ultimoTiempo = tiempo;
      ctx.clearRect(0, 0, ancho, alto);

      for (const pieza of piezas) {
        pieza.actualizar(dt, tiempo);
      }

      resolverColisiones();

      for (const pieza of piezas) {
        pieza.dibujar();
      }

      raf = requestAnimationFrame(dibujar);
    }

    function iniciar() {
      cancelAnimationFrame(raf);
      ultimoTiempo = 0;
      arrastrada = null;
      punteroAnterior = null;

      ajustarCanvas();
      crearPiezas();

      raf = requestAnimationFrame(dibujar);
    }

    function posicion(evento) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: evento.clientX - rect.left,
        y: evento.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", evento => {
      const p = posicion(evento);

      for (let i = piezas.length - 1; i >= 0; i--) {
        const pieza = piezas[i];

        if (!pieza.listo) continue;

        if (Math.hypot(p.x - pieza.x, p.y - pieza.y) <= pieza.t * 0.7) {
          arrastrada = pieza;
          pieza.agarrada = true;
          pieza.reactivar();
          punteroAnterior = p;

          piezas.splice(i, 1);
          piezas.push(pieza);

          canvas.setPointerCapture(evento.pointerId);
          evento.preventDefault();
          break;
        }
      }
    });

    canvas.addEventListener("pointermove", evento => {
      if (!arrastrada || !punteroAnterior) return;

      const p = posicion(evento);

      arrastrada.vx = limitar(
        (p.x - punteroAnterior.x) * 0.5, -10, 10
      );

      arrastrada.vy = limitar(
        (p.y - punteroAnterior.y) * 0.5, -10, 10
      );

      arrastrada.x = p.x;
      arrastrada.y = p.y;
      punteroAnterior = p;
    });

    function soltar() {
      if (!arrastrada) return;

      arrastrada.agarrada = false;
      arrastrada.quieta = false;
      arrastrada.vx = limitar(arrastrada.vx, -10, 10);
      arrastrada.vy = limitar(arrastrada.vy, -10, 10);

      arrastrada = null;
      punteroAnterior = null;
    }

    canvas.addEventListener("pointerup", soltar);
    canvas.addEventListener("pointercancel", soltar);
    boton.addEventListener("click", iniciar);

    window.addEventListener("resize", () => {
      ajustarCanvas();

      for (const pieza of piezas) {
        pieza.x = limitar(
          pieza.x,
          pieza.t / 2,
          ancho - pieza.t / 2
        );
      }
    });

    iniciar();
  </script>
</body>
</html>
