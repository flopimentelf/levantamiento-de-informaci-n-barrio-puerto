
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Tramas de elección</title>

  <style>
    :root {
      --rojo: 220, 66, 69;
      --azul: 63, 132, 205;
      --amarillo: 246, 194, 65;
      --verde: 77, 166, 125;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #202020;
      font-family: Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .pagina {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    #lluvia {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 5vw;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .marca {
      font-weight: 700;
    }

    .numero {
      color: #777;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 75svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 8vh 10vw 24vh;
      pointer-events: none;
    }

    .etiqueta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #666;
    }

    .punto {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgb(var(--verde));
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(48px, 9vw, 112px);
      line-height: 0.91;
      letter-spacing: -0.085em;
      font-weight: 700;
    }

    h1 span {
      display: block;
      color: #999;
      font-weight: 400;
    }

    .descripcion {
      max-width: 340px;
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    footer {
      position: absolute;
      z-index: 2;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 5vw 30px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0.8) 40%,
        rgba(255,255,255,0.96)
      );
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
    }

    .colores {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .color {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .rojo { background: rgba(var(--rojo), .7); }
    .azul { background: rgba(var(--azul), .7); }
    .amarillo { background: rgba(var(--amarillo), .8); }
    .verde { background: rgba(var(--verde), .7); }

    .reiniciar {
      pointer-events: auto;
      border: 1px solid #ddd;
      background: rgba(255,255,255,.88);
      color: #333;
      border-radius: 100px;
      padding: 11px 16px;
      font: inherit;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }

    .reiniciar:hover {
      background: #f4f4f4;
      border-color: #aaa;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 6vw;
      }

      main {
        padding: 10vh 7vw 28vh;
      }

      h1 {
        font-size: clamp(48px, 14vw, 78px);
      }

      .descripcion {
        max-width: 280px;
        font-size: 13px;
      }

      footer {
        padding: 20px 6vw 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="pagina" id="pagina">
    <canvas id="lluvia" aria-hidden="true"></canvas>

    <header>
      <div class="marca">Proyecto de observación</div>
      <div class="numero">Visualización / 001</div>
    </header>

    <main>
      <div class="etiqueta">
        <span class="punto"></span>
        Levantamiento de información
      </div>

      <h1>
        Tramas
        <span>de elección.</span>
      </h1>

      <p class="descripcion">
        Cada elección deja una huella. Las piezas se acumulan,
        se encuentran y construyen una imagen colectiva del territorio.
      </p>
    </main>

    <footer>
      <div>
        <div>Una construcción colectiva</div>
        <div class="colores" aria-label="Paleta de cuatro colores">
          <span class="color rojo"></span>
          <span class="color azul"></span>
          <span class="color amarillo"></span>
          <span class="color verde"></span>
        </div>
      </div>

      <button class="reiniciar" id="reiniciar" type="button">
        ↻ Ver de nuevo
      </button>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("lluvia");
    const ctx = canvas.getContext("2d");
    const pagina = document.getElementById("pagina");
    const boton = document.getElementById("reiniciar");

    const paleta = [
      [220, 66, 69],   // Rojo
      [63, 132, 205],  // Azul
      [246, 194, 65],  // Amarillo
      [77, 166, 125]   // Verde
    ];

    let ancho = 0;
    let alto = 0;
    let piezas = [];
    let animacion = 0;
    let ultimoTiempo = 0;
    let reduccionMovimiento =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const aleatorio = (min, max) =>
      Math.random() * (max - min) + min;

    class Octagono {
      constructor(x, y, tamano, color, retraso = 0) {
        this.x = x;
        this.y = y;
        this.tamano = tamano;
        this.color = color;
        this.rotacion = aleatorio(0, Math.PI / 4);
        this.vx = aleatorio(-0.7, 0.7);
        this.vy = aleatorio(0.5, 2);
        this.retraso = retraso;
        this.edad = 0;
        this.opacidad = aleatorio(0.32, 0.57);
        this.asentado = false;
      }

      dibujar() {
        const radio = this.tamano / 2;
        const lados = 8;
        const recorte = Math.cos(Math.PI / 8);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotacion);

        ctx.beginPath();

        for (let i = 0; i < lados; i++) {
          const angulo =
            (Math.PI * 2 * i) / lados - Math.PI / 8;

          const px = Math.cos(angulo) * radio;
          const py = Math.sin(angulo) * radio;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        ctx.closePath();

        ctx.fillStyle =
          `rgba(${this.color.join(",")},${this.opacidad})`;
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle =
          `rgba(${this.color.join(",")},0.5)`;
        ctx.stroke();

        // Una cara sutil para dar profundidad.
        ctx.beginPath();
        ctx.moveTo(-radio * 0.55, -radio * 0.55);
        ctx.lineTo(radio * 0.55, -radio * 0.55);
        ctx.lineTo(radio * 0.8, -radio * 0.1);
        ctx.strokeStyle = "rgba(255,255,255,0.38)";
        ctx.stroke();

        ctx.restore();
      }

      actualizar(dt, tiempo) {
        if (this.asentado) return;
        if (tiempo < this.retraso) return;

        this.edad += dt;

        // Gravedad.
        this.vy += 0.12 * dt;
        this.vy = Math.min(this.vy, 7);

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Leve giro durante la caída.
        this.rotacion += this.vx * 0.008 * dt;

        const radio = this.tamano / 2;
        const base = alto - radio - 4;

        // Rebote muy pequeño al tocar el suelo.
        if (this.y >= base) {
          this.y = base;
          this.vy = 0;
          this.vx *= 0.3;
          this.asentado = true;
        }

        // Colisión circular aproximada entre piezas.
        // Permite apilar, trabar y superponer octágonos.
        for (const otra of piezas) {
          if (otra === this || !otra.asentado) continue;

          const dx = this.x - otra.x;
          const dy = this.y - otra.y;
          const distancia = Math.hypot(dx, dy);
          const limite = (this.tamano + otra.tamano) * 0.43;

          if (distancia < limite && distancia > 0) {
            const solapamiento = limite - distancia;

            this.y -= solapamiento * 0.82;
            this.x += (dx / distancia) * solapamiento * 0.22;

            // Una vez apoyada sobre otra pieza, se detiene.
            if (this.y < otra.y && this.vy > 0) {
              this.vy *= 0.1;

              if (this.vy < 0.35) {
                this.vy = 0;
                this.asentado = true;
              }
            }
          }
        }

        // Mantener las piezas dentro del área visible.
        if (this.x < radio) {
          this.x = radio;
          this.vx *= -0.4;
        }

        if (this.x > ancho - radio) {
          this.x = ancho - radio;
          this.vx *= -0.4;
        }
      }
    }

    function ajustarCanvas() {
      const rect = pagina.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      ancho = rect.width;
      alto = rect.height;

      canvas.width = Math.round(ancho * dpr);
      canvas.height = Math.round(alto * dpr);
      canvas.style.width = ancho + "px";
      canvas.style.height = alto + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function crearLluvia() {
      piezas = [];

      const cantidad = Math.min(
        115,
        Math.max(42, Math.floor(ancho / 7))
      );

      for (let i = 0; i < cantidad; i++) {
        const tamano = aleatorio(22, 48);
        const x = aleatorio(tamano, ancho - tamano);
        const y = aleatorio(-alto * 0.9, -35);
        const color = paleta[
          Math.floor(Math.random() * paleta.length)
        ];

        piezas.push(
          new Octagono(
            x,
            y,
            tamano,
            color,
            reduccionMovimiento ? 0 : i * 32
          )
        );
      }

      if (reduccionMovimiento) {
        piezas.forEach((pieza, i) => {
          pieza.y = alto * 0.48 + (i % 7) * 38;
          pieza.x = (i / piezas.length) * ancho;
          pieza.asentado = true;
          pieza.vy = 0;
        });
      }
    }

    function dibujar(tiempo) {
      const dt = Math.min(
        (tiempo - (ultimoTiempo || tiempo)) / 16.67,
        2
      );
      ultimoTiempo = tiempo;

      ctx.clearRect(0, 0, ancho, alto);

      for (const pieza of piezas) {
        pieza.actualizar(dt, tiempo);
        pieza.dibujar();
      }

      animacion = requestAnimationFrame(dibujar);
    }

    function iniciar() {
      cancelAnimationFrame(animacion);
      ultimoTiempo = 0;
      ajustarCanvas();
      crearLluvia();
      animacion = requestAnimationFrame(dibujar);
    }

    boton.addEventListener("click", iniciar);

    window.addEventListener("resize", () => {
      ajustarCanvas();
    });

    iniciar();
  </script>
</body>
</html>
